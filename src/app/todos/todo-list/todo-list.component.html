<div class="todo-container">
  <h2 class="title">Todo List</h2>
  <div *ngFor="let todo of todos$ | async" class="todo-card">
    <div class="todo-info">
      <p class="todo-title">{{ todo.title }}</p>
      <p class="todo-status">
        Status:
        <span [class.completed]="todo.completed">{{
          todo.completed ? "Completed" : "Pending"
        }}</span>
      </p>
    </div>
    <div class="todo-actions">
      <!-- <button class      <button class="btn btn-delete" (click)="onDeleteTask(todo.id)">
        <i class="fa-solid fa-trash" aria-hidden="true"></i>
      </button>="btn btn-complete" (click)="toggleComplete(todo)">
        {{ todo.completed ? "Undo" : "Complete" }}
      </button> -->
      <!-- <button class="btn btn-delete" (click)="onDeleteTask(todo.id)">
        <i class="fa-solid fa-trash" aria-hidden="true"></i>
      </button> -->
    </div>
  </div>
</div>
